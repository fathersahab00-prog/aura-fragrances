<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#C8A45D" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7B38" />
      <stop offset="25%" stop-color="#F0D58D" />
      <stop offset="50%" stop-color="#C8A45D" />
      <stop offset="75%" stop-color="#FFF3CE" />
      <stop offset="100%" stop-color="#84652A" />
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F0F12" />
      <stop offset="15%" stop-color="#1E1E24" />
      <stop offset="35%" stop-color="#0D0D10" />
      <stop offset="70%" stop-color="#141419" />
      <stop offset="85%" stop-color="#262630" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
    <linearGradient id="innerJuice" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#84652A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#C8A45D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9A7B38" stop-opacity="0.1" />
    </linearGradient>
    <filter id="pedestalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
  </defs>

  <!-- Ambient Golden Halo -->
  <ellipse cx="200" cy="300" rx="190" ry="210" fill="url(#halo)" />

  <!-- Ground Reflection / Shadow -->
  <ellipse cx="200" cy="505" rx="140" ry="18" fill="#000000" opacity="0.9" filter="url(#pedestalShadow)" />
  <ellipse cx="200" cy="505" rx="90" ry="8" fill="#C8A45D" opacity="0.15" filter="url(#pedestalShadow)" />

  <!-- Perfume Cap -->
  <!-- Cap Finial / Stepped Top -->
  <rect x="155" y="70" width="90" height="14" rx="2" fill="url(#goldCap)" stroke="#000" stroke-width="0.5" />
  <!-- Main Cap Body -->
  <rect x="150" y="84" width="100" height="75" rx="3" fill="url(#goldCap)" stroke="#3A2D10" stroke-width="0.5" />
  <!-- Cap Vertical Knurling / Reflections -->
  <line x1="165" y1="86" x2="165" y2="157" stroke="#FFF7DE" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="175" y1="86" x2="175" y2="157" stroke="#000" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="225" y1="86" x2="225" y2="157" stroke="#FFF7DE" stroke-opacity="0.6" stroke-width="1.5" />
  <line x1="235" y1="86" x2="235" y2="157" stroke="#000" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Collar / Neck -->
  <rect x="165" y="159" width="70" height="18" rx="1" fill="url(#goldCap)" />
  <line x1="165" y1="168" x2="235" y2="168" stroke="#5E481B" stroke-width="1" />

  <!-- Bottle Shoulder Bevel -->
  <path d="M125 190 L165 177 L235 177 L275 190 Z" fill="#1C1C22" stroke="url(#rimLight)" stroke-width="0.8" />

  <!-- Main Flacon Body (Heavy Obsidian Crystal) -->
  <rect x="120" y="190" width="160" height="280" rx="6" fill="url(#glassBody)" stroke="rgba(200, 164, 93, 0.4)" stroke-width="1" />

  <!-- Inner Liquid Glow -->
  <rect x="128" y="210" width="144" height="240" rx="3" fill="url(#innerJuice)" />

  <!-- Glass Vertical Specular Reflection -->
  <rect x="126" y="195" width="12" height="268" rx="2" fill="#FFFFFF" opacity="0.12" />
  <rect x="144" y="195" width="4" height="268" rx="1" fill="#FFFFFF" opacity="0.06" />
  <rect x="258" y="195" width="16" height="268" rx="2" fill="#FFFFFF" opacity="0.08" />
  <line x1="120" y1="190" x2="120" y2="470" stroke="url(#rimLight)" stroke-width="1.2" opacity="0.8" />
  <line x1="280" y1="190" x2="280" y2="470" stroke="url(#rimLight)" stroke-width="1.2" opacity="0.5" />

  <!-- Heavy Glass Base -->
  <path d="M121 445 L279 445 L279 468 Q279 470 277 470 L123 470 Q121 470 121 468 Z" fill="#0A0A0E" stroke="rgba(200, 164, 93, 0.2)" stroke-width="0.8" />
  <rect x="135" y="454" width="130" height="2" fill="#C8A45D" opacity="0.4" />

  <!-- Luxury Gold Label Plate -->
  <rect x="145" y="270" width="110" height="130" rx="2" fill="#0B0B0D" stroke="url(#goldCap)" stroke-width="1.2" />
  <rect x="149" y="274" width="102" height="122" rx="1" fill="none" stroke="url(#goldCap)" stroke-width="0.5" stroke-opacity="0.6" />

  <!-- Label Typography & Emblems -->
  <!-- Mini AF Monogram -->
  <circle cx="200" cy="296" r="12" fill="none" stroke="url(#goldCap)" stroke-width="0.8" />
  <text x="200" y="300" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="10" font-weight="700" fill="#F0D58D" letter-spacing="1">AF</text>
  
  <!-- Brand Name -->
  <text x="200" y="324" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="11" font-weight="700" fill="#F6F3EC" letter-spacing="2">AURA</text>
  <text x="200" y="335" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="5" font-weight="500" fill="#C8A45D" letter-spacing="2.5">BY FRIENDS</text>
  
  <line x1="170" y1="344" x2="230" y2="344" stroke="#C8A45D" stroke-width="0.5" stroke-opacity="0.6" />
  
  <text x="200" y="358" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="9" font-style="italic" fill="#F0D58D" letter-spacing="1.5">PARFUM</text>
  <text x="200" y="375" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="5" fill="#AAA39A" letter-spacing="1.5">[PLACEHOLDER]</text>
  <text x="200" y="386" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="4.5" fill="#C8A45D" letter-spacing="1">100 ML</text>
</svg>
