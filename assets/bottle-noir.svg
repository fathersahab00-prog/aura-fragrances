<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <radialGradient id="n-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="n-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7B38" />
      <stop offset="30%" stop-color="#F0D58D" />
      <stop offset="60%" stop-color="#C8A45D" />
      <stop offset="100%" stop-color="#84652A" />
    </linearGradient>
    <linearGradient id="n-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="25%" stop-color="#222227" />
      <stop offset="60%" stop-color="#111113" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="230" rx="140" ry="140" fill="url(#n-halo)" />
  <ellipse cx="160" cy="380" rx="90" ry="12" fill="#000000" opacity="0.8" />
  <!-- Cap -->
  <rect x="125" y="60" width="70" height="55" rx="3" fill="url(#n-gold)" />
  <rect x="135" y="115" width="50" height="12" fill="url(#n-gold)" />
  <!-- Body -->
  <rect x="95" y="127" width="130" height="230" rx="5" fill="url(#n-body)" stroke="rgba(200, 164, 93, 0.4)" stroke-width="1" />
  <!-- Specular Reflection -->
  <rect x="100" y="132" width="8" height="220" fill="#FFF" opacity="0.12" />
  <rect x="212" y="132" width="10" height="220" fill="#FFF" opacity="0.08" />
  <!-- Label -->
  <rect x="115" y="185" width="90" height="105" rx="2" fill="#0E0E10" stroke="url(#n-gold)" stroke-width="1" />
  <circle cx="160" cy="210" r="10" fill="none" stroke="url(#n-gold)" stroke-width="0.8" />
  <text x="160" y="214" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="8" font-weight="700" fill="#F0D58D">AF</text>
  <text x="160" y="235" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="10" font-weight="700" fill="#F6F3EC" letter-spacing="1.5">AURA</text>
  <text x="160" y="245" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="5" fill="#C8A45D" letter-spacing="2">FOR HIM</text>
  <line x1="130" y1="252" x2="190" y2="252" stroke="#C8A45D" stroke-width="0.5" opacity="0.5" />
  <text x="160" y="265" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-style="italic" fill="#F0D58D">[EDP]</text>
  <text x="160" y="277" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="4.5" fill="#AAA39A">100 ML</text>
</svg>
