<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <radialGradient id="u-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="u-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A45D" />
      <stop offset="50%" stop-color="#F0D58D" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="u-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="35%" stop-color="#282830" />
      <stop offset="70%" stop-color="#141416" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="230" rx="140" ry="140" fill="url(#u-halo)" />
  <ellipse cx="160" cy="385" rx="85" ry="11" fill="#000000" opacity="0.8" />
  <!-- Magnetic Minimalist Cap -->
  <rect x="130" y="55" width="60" height="70" rx="30" fill="#1C1C1F" stroke="url(#u-gold)" stroke-width="1" />
  <rect x="127" y="115" width="66" height="10" rx="2" fill="url(#u-gold)" />
  <!-- Cylinder Body -->
  <rect x="105" y="125" width="110" height="235" rx="20" fill="url(#u-body)" stroke="rgba(200, 164, 93, 0.35)" stroke-width="1" />
  <!-- Cylindrical Highlight -->
  <line x1="120" y1="135" x2="120" y2="350" stroke="#FFF" stroke-width="6" opacity="0.1" stroke-linecap="round" />
  <line x1="130" y1="135" x2="130" y2="350" stroke="#FFF" stroke-width="2" opacity="0.05" stroke-linecap="round" />
  <!-- Vertical Modern Label -->
  <rect x="125" y="185" width="70" height="115" rx="4" fill="#0C0C0E" stroke="rgba(200, 164, 93, 0.7)" stroke-width="0.8" />
  <text x="160" y="215" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="10" font-weight="700" fill="#F6F3EC" letter-spacing="2">AURA</text>
  <text x="160" y="226" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="4.5" fill="#C8A45D" letter-spacing="2.5">UNISEX</text>
  <line x1="140" y1="234" x2="180" y2="234" stroke="#C8A45D" stroke-width="0.5" opacity="0.4" />
  <text x="160" y="250" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="5" fill="#AAA39A" letter-spacing="1">SIGNATURE</text>
  <text x="160" y="265" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="7" font-style="italic" fill="#F0D58D">[EXTRAIT]</text>
  <text x="160" y="280" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="4.5" fill="#888">100 ML</text>
</svg>
